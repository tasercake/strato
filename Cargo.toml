[workspace]
members = [
    "crates/strato_cache",
    "crates/strato_cli",
    "crates/strato_core",
]
exclude = ["vendor/ruff"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
authors = ["Krishna Penukonda <krishna@penukonda.me>"]
homepage = "https://strato.penukonda.me"
documentation = "https://strato.penukonda.me"
license = "MIT"
repository = "https://github.com/tasercake/strato"

[workspace.dependencies]
anyhow = "1.0.102"
assert_cmd = "2.2.1"
camino = { version = "1.2.2", features = ["serde1"] }
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.25"
hex = "0.4.3"
insta = "1.47.2"
miette = { version = "7.6.0", features = ["fancy"] }
petgraph = "0.8.3"
predicates = "3.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.18"
toml = "1.1.2"
tracing = "0.1.43"
sha2 = "0.11.0"
ruff_cache = { path = "vendor/ruff/crates/ruff_cache" }
ruff_annotate_snippets = { path = "vendor/ruff/crates/ruff_annotate_snippets" }
ruff_macros = { path = "vendor/ruff/crates/ruff_macros" }
ruff_python_ast = { path = "vendor/ruff/crates/ruff_python_ast" }
ruff_python_parser = { path = "vendor/ruff/crates/ruff_python_parser" }
ruff_python_trivia = { path = "vendor/ruff/crates/ruff_python_trivia" }
ruff_source_file = { path = "vendor/ruff/crates/ruff_source_file" }
ruff_text_size = { path = "vendor/ruff/crates/ruff_text_size" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
