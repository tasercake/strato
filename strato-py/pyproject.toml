[project]
name = "strato"
description = "Python linter to catch common asyncio pitfalls."
requires-python = ">=3.11"
authors = [{ name = "Krishna Penukonda", email = "krishna@penukonda.me" }]
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"] # Version is automatically determined by build backend
dependencies = [
    "typer>=0.12.3",
    "tree-sitter",
    "tree-sitter-python @ git+https://github.com/tree-sitter/tree-sitter-python",
]

[tool.uv]
package = true

[project.scripts]
strato = "strato.cli:app"

[project.optional-dependencies]
dev = ["pytest"]
