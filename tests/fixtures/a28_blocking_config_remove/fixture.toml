id = "A28"
name = "Blocking Config Remove"
source_files = ["main.py"]
config_files = ["pyproject.toml"]

[[runs]]
name = "default"
purpose = "proves the built-in database flags time.sleep before the remove override"
args = ["check", ".", "--output", "json"]
config = "defaults"
cache = "disabled"
expected_exit_code = 1

[runs.expectation]
mode = "partial_json"
path = "expected-default.json"
assert = ["diagnostics"]

[[runs]]
name = "blocking-remove"
purpose = "removes a built-in blocking entry without treating the unresolved external as blocking"
args = ["check", ".", "--output", "json"]
config = "pyproject.toml"
cache = "disabled"
expected_exit_code = 0

[runs.expectation]
mode = "partial_json"
path = "expected.json"
assert = ["diagnostics"]
